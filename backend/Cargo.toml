[package]
name = "trading-platform-backend"
version = "0.1.0"
edition = "2021"
authors = ["Arkady <arkady@trading-platform.dev>"]
description = "High-performance trading platform backend"

[dependencies]
# Web Framework
actix-web = "4"
actix-web-actors = "4"
actix-cors = "0.6"

# Async Runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.20"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono"] }

# Cache
redis = { version = "0.23", features = ["tokio-comp", "connection-manager"] }

# Cryptography
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dotenvy = "0.15"
config = "0.13"

# Error Handling
thiserror = "1"
anyhow = "1"

# Metrics
prometheus = "0.13"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
actix-rt = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
